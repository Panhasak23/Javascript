<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form-Basic Authentication</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../style/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <section class="vh-100 gradient-custom">
        <div class="container py-5 h-100">
            <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col-12 col-md-8 col-lg-6 col-xl-5">
                <div class="card bg-dark text-white" style="border-radius: 1rem;">
                    <div class="card-body p-5 text-center">
                        <form id="loginForm">
                            <div class="mb-md-5 mt-md-4 pb-5">
                                <h2 class="fw-bold mb-2 text-uppercase">Login Form</h2>
                                <p class="text-white-50 mb-5">Please enter your username and password!</p>

                                <div class="form-floating mb-3 mt-3">
                                    <input type="text" class="form-control" placeholder="Enter username" id="username" required>
                                    <label id="email">Username</label>
                                    <!-- <div class="text-danger text-lg-start" id="error"></div> -->
                                </div>
                                <div class="form-floating mb-3 mt-3">
                                    <input type="password" class="form-control" placeholder="Enter password" id="psw" required>
                                    <label id="email">Password</label>
                                    <!-- <div class="text-danger text-lg-start" id="error"></div> -->
                                </div> 
                                <div class="py-3">
                                    <button data-mdb-button-init data-mdb-ripple-init class="btn btn-outline-light btn-lg px-5" type="submit">Login</button>
                                </div>
                                <div>
                                    <p class="mb-0" id="messageArea">Warning! Invalid input(s).
                                    </p>
                                </div>
                            </div>
                        </form>                    
                    </div>
            </div>
            </div>
        </div>
        </div>
    </section>
</body>
</html>
<script src="../script/index.js" defer></script>
