<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <form id="registrationForm" novalidate>
            <h1>Create Account</h1>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username">
                <div class="error-message">Username is required</div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
                <div class="error-message">Email is required</div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Min. 6 characters">
                <div class="error-message">Password is required</div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password">
                <div class="error-message">Passwords do not match</div>
            </div>

            <button type="submit" id="submitBtn">Register</button>
            <p id="warningMessage" class="warning">Warning! Please fix the errors above.</p>
            <p id="successMessage" class="success">Account created and saved to the database!</p>
            <p id="serverMessage" class="server-error"></p>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
